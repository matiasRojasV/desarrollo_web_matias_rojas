<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Métricas - Avistamiento de Aves</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>   
    </head>

    <body>
        <header>
            <div id="auth-container">
                <a href="{{ url_for('login') }}" class="auth-link">Registro / Login</a>
            </div>

            <h1>Unión de Ornitólogos de Chile</h1>
            <nav>
                <ul>
                    <li><a href="{{ url_for('index') }}">Inicio</a></li>
                    <li><a href="{{ url_for('avistamiento') }}">Informar Avistamiento</a></li>
                    <li><a href="{{ url_for('dashboard') }}">Métricas</a></li>
                </ul>
            </nav>
        </header>

        <main class="dashboard-main">
            <h2>Dashboard de Métricas</h2>
            <p>Visualización del registro de voluntarios y avistamientos.</p>

            <div class="graficos-grid">
                <div class="grafico-card">
                    <h3>Voluntarios Registrados por Región</h3>
                    <canvas id="chart-voluntarios-region"></canvas>
                </div>

                <div class="grafico-card">
                    <h3>Avistamientos Registrados</h3>
                    <canvas id="chart-avistamientos-registrados"></canvas>
                </div>
            </div>
        </main>

        <script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
        <script src="{{ url_for('static', filename='js/authHeader.js') }}"></script>
    </body>
</html>
