<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Avistamiento de Aves en Chile - Inicio</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    </head>

    <body>
        <header>
            <div id="auth-container">
                <a href="{{ url_for('login') }}" class="auth-link">Registro / Login</a>
            </div>

            <h1>Unión de Ornitólogos de Chile</h1>
            <nav>
                <ul>
                    <li><a href="{{ url_for('index') }}">Inicio</a></li>
                    <li><a href="{{ url_for('avistamiento') }}">Informar Avistamiento</a></li>
                    <li><a href="{{ url_for('dashboard') }}">Métricas</a></li>
                </ul>
            </nav>
        </header>

        <main>
            <h2>Registro Nacional de Avistamientos</h2>
            <p>Consulta los avistamientos reportados por voluntarios en todo el país.</p>

            <!-- Barra de Filtros y Ordenamiento -->
            <div class="filtros-section">
                <form id="form-filtros" onsubmit="event.preventDefault();">
                    <div class="filtro-grupo">
                        <label for="filtro-tipo">Filtrar por Tipo de Ave:</label>
                        <select id="filtro-tipo" name="tipo">
                            <option value=""> Todos los tipos </option>
                            <option value="rapiña">Aves de Rapiña</option>
                            <option value="marina">Aves Marinas</option>
                            <option value="terrestre">Aves Terrestres</option>
                        </select>
                    </div>

                    <div class="filtro-grupo">
                        <label for="ordenar-por">Ordenar por:</label>
                        <select id="ordenar-por" name="orden">
                            <option value="fecha-desc">Fecha (más reciente)</option>
                            <option value="fecha-asc">Fecha (más antigua)</option>
                            <option value="lugar">Lugar (A-Z)</option>
                        </select>
                    </div>
                </form>
            </div>

            <!-- Contenedor para Avistamientos -->
            <div class="contenedor-scroll">
                <div class="lista-avistamientos">
                    {% for avistamiento in ultimos_avistamientos %}
                        <article class="tarjeta-ave">
                            <!-- datos que vienen de la BD -->
                        </article>
                    {% endfor %}
                </div>
            </div>

            <nav class="paginacion" aria-label="Paginacion de avistamientos">
                <button type="button" id="btn-anterior" class="btn-paginacion">Anterior</button>
                <p id="paginacion-info" class="paginacion-info">Pagina 1 de 1</p>
                <button type="button" id="btn-siguiente" class="btn-paginacion">Siguiente</button>
            </nav>

        </main>
        <script src="{{ url_for('static', filename='js/indexFilter.js') }}"></script>
        <script src="{{ url_for('static', filename='js/authHeader.js') }}"></script>
    </body>
</html>
