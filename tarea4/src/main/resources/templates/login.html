<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{base :: layout(~{::title}, ~{::main}, ~{::scripts})}">
    <head><title>Registro de Voluntarios - Aves en Chile</title></head>
    
    <body>
        <main class="form">
            <h2>Formulario de Registro de Voluntarios</h2>
            <p>Los campos marcados con (*) son obligatorios.</p>
            <div id="mensajes-error" role="alert">
                <div class="alerta-error" th:if="${errores != null}">
                    <ul><li th:each="error : ${errores}" th:text="${error}"></li></ul>
                </div>
            </div>

            <form id="form-voluntario" th:action="@{/login}" method="post">
                <fieldset>
                    <legend>Información Personal y Contacto</legend>
                    <p><label for="nombre">Nombre Completo (*):</label><input type="text" id="nombre" name="nombre" required></p>
                    <p><label for="email">Correo (*):</label><input type="email" id="email" name="email" placeholder="ejemplo@correo.cl" required></p>
                    <p><label for="celular">Celular (*):</label><input type="text" id="celular" name="celular" placeholder="+56912345678" required></p>
                </fieldset>

                <fieldset>
                    <legend>Dirección Postal</legend>
                    <p>
                        <label for="region">Región (*):</label>
                        <select id="region" name="region" required>
                            <option value="">Seleccione una región</option>
                            <option th:each="region : ${regiones}" th:value="${region.id}" th:text="${region.nombre}"></option>
                        </select>
                    </p>
                    <p>
                        <label for="comuna">Comuna (*):</label>
                        <select id="comuna" name="comuna" disabled required>
                            <option value="">Seleccione una región primero</option>
                        </select>
                    </p>
                </fieldset>

                <button type="submit">Registrar Voluntario</button>
            </form>
        </main>
        
        <th:block th:fragment="scripts"><script th:src="@{/js/singUpVal.js(v=2)}"></script></th:block>
    </body>
</html>
