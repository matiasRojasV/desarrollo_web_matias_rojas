<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{base :: layout(~{::title}, ~{::main}, ~{::scripts})}">
    <head><title>Informar Avistamiento - Aves en Chile</title></head>

    <body>
        <main class="form">
            <h2>Formulario de Avistamiento de aves</h2>
            <p>Los campos marcados con (*) son obligatorios.</p>
            
            <div id="mensajes-error" role="alert">
                <div class="alerta-error" th:if="${errores != null}">
                    <ul><li th:each="error : ${errores}" th:text="${error}"></li></ul>
                </div>
            </div>

            <form id="form-avistamiento" th:action="@{/avistamiento}" method="post" enctype="multipart/form-data">
                <fieldset>
                    <legend>Información</legend>
                    <p>
                        <label for="ave_id">Nombre del ave (*):</label>
                        <select id="ave_id" name="ave_id" required>
                            <option value="">Seleccione un ave</option>
                            <option th:each="ave : ${aves}" th:value="${ave.id}" th:text="${ave.nombre}"></option>
                        </select>
                    </p>
                    <p><label for="lugar">Lugar del Avistamiento (*):</label><input type="text" id="lugar" name="lugar" maxlength="200" required></p>
                    <p><label for="descripcion">Descripción / Observaciones:</label><textarea id="descripcion" name="descripcion" rows="3" maxlength="500"></textarea></p>
                </fieldset>
                
                <fieldset>
                    <legend>Fecha y Hora del Avistamiento</legend>
                    <p><label for="fecha">Fecha (*):</label><input type="date" id="fecha" name="fecha" required></p>
                    <p><label for="hora">Hora (*):</label><input type="time" id="hora" name="hora" required></p>
                </fieldset>
                
                <fieldset>
                    <legend>Registro Visual</legend>
                    <p><label for="multimedia">Foto o vídeo del avistamiento (*):</label>
                        <input type="file" id="multimedia" name="multimedia" accept="image/*,video/*" multiple required></p>
                </fieldset>
                <button type="submit">Registrar Avistamiento</button>
            </form>
        </main>

    <th:block th:fragment="scripts"><script th:src="@{/js/avistamientoVal.js(v=2)}"></script></th:block>

</body>
</html>
